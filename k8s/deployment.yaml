apiVersion: apps/v1

kind: Deployment

metadata:
  name: pneumonia-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pneumonia-api

  template:
    metadata:
      labels:
        app: pneumonia-api

    spec:
      containers:
      - name: pneumonia-api

        image: pneumonia-api:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8000