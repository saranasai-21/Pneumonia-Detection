<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <div class="container">
            <div class="hero">
                <div class="badge">AI Medical Demo</div>
                <h1>Pneumonia Detection System</h1>
                <p>Upload a chest X-ray image to get prediction and highlighted region.</p>
            </div>

            <div class="upload-card">
                <input type="file" id="imageInput" accept="image/*">
                <button onclick="uploadImage()">Predict</button>
            </div>

            <div class="preview-area">
                <div class="panel">
                    <h3>Selected Image</h3>
                    <img id="preview" src="" alt="Preview" style="display:none;">
                </div>
            </div>

            <div id="result" class="result-box" style="display:none;"></div>

            <div id="imageResults" class="image-results" style="display:none;">
                <div class="panel">
                    <h3>Original Image</h3>
                    <img id="originalImage" src="" alt="Original Image">
                </div>

                <div class="panel">
                    <h3>Grad-CAM Heatmap</h3>
                    <img id="heatmapImage" src="" alt="Heatmap Image">
                </div>

                <div class="panel">
                    <h3>Rounded Suspicious Area</h3>
                    <img id="roundedImage" src="" alt="Rounded Region Image">
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");
        const resultDiv = document.getElementById("result");
        const imageResults = document.getElementById("imageResults");

        imageInput.addEventListener("change", function () {
            const file = imageInput.files[0];
            if (!file) return;
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        });

        async function uploadImage() {
            const file = imageInput.files[0];

            if (!file) {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<p class="error-text">Please select an image first.</p>`;
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<p class="loading-text">Predicting...</p>`;
            imageResults.style.display = "none";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    resultDiv.innerHTML = `<p class="error-text">Error: ${data.error || "Prediction failed"}</p>`;
                    return;
                }

                resultDiv.innerHTML = `
                    <div class="prediction-title ${data.prediction === "PNEUMONIA" ? "danger" : "safe"}">
                        ${data.prediction}
                    </div>

                    <div class="confidence-row">
                        <span>Confidence</span>
                        <span>${data.confidence}%</span>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar ${data.prediction === "PNEUMONIA" ? "danger-bar" : "safe-bar"}"
                             style="width:${data.confidence}%"></div>
                    </div>

                    <p class="small-note">This is an AI prediction for educational/demo use.</p>
                `;

                document.getElementById("originalImage").src = `data:image/jpeg;base64,${data.original_image}`;
                document.getElementById("heatmapImage").src = `data:image/jpeg;base64,${data.heatmap_image}`;
                document.getElementById("roundedImage").src = `data:image/jpeg;base64,${data.rounded_image}`;

                imageResults.style.display = "grid";
            } catch (error) {
                resultDiv.innerHTML = `<p class="error-text">Request failed: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
